name: career-buddy CI

# Fork-level CI: runs on every push to any branch and on every PR, so a change
# is checked before it is merged (upstream's test.yml/web-ci.yml only fire on
# PRs to main). Kept in its own file so
# `git pull --rebase upstream main` never conflicts with upstream workflows.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Skip the postinstall (Playwright download); the quick suite never
      # launches a browser.
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: node test-all.mjs --quick

  app:
    name: shared + backend + frontend tests, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            shared/package-lock.json
      # Backend tests run the real core scripts, which import the core's own
      # dependencies; no browser download.
      - run: npm install --ignore-scripts
      - run: npm ci
        working-directory: shared
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: shared
      - run: npm test
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm test
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
