name: Web CI

# CI for the web app (frontend/, backend/, shared/). Informative by design: it
# is NOT a required check for the core — a red here never blocks a core merge,
# and core changes never trigger it.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            shared/package-lock.json
      # The doctor parity test runs the real core doctor.mjs, which imports the
      # core's own dependencies (js-yaml, dotenv). Installed the same way as
      # test.yml: no lockfile at the root, and no browser download.
      - name: Install core dependencies
        run: npm install --ignore-scripts
      - run: npm ci
        working-directory: shared
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: shared
      - run: npm test
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm test
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
